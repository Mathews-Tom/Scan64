# Material board textures for the web client (issue #363).
# Build: uv run scripts/build-board-textures.py
# Every source is CC0-1.0. Only albedo (diffuse/colour) maps are used, so boards stay matte:
# no roughness, normal, specular or gloss data is read.

[output]
dir = "apps/scan64-web/public/boards"
manifest = "apps/scan64-web/src/boardMaterials.generated.json"
cache_dir = "build/board-textures/sources"
# 8 squares x 250 px: a 1000 CSS px board on a 2x screen maps one texel per device pixel.
board_px = 2000
webp_quality = 80
avif_quality = 56
# Per-board budget for the texture a browser downloads (AVIF where supported, otherwise WebP).
budget_bytes_per_board = 700_000
# FIDE Handbook C.02 names light (white, cream, ivory, buff) and dark (brown, walnut) squares but no
# number. This repository measures the mean WCAG relative-luminance ratio of light to dark squares
# and requires at least the default Brown and cream palette (#f0d9b5 / #9e7150 = 3.10:1).
min_luminance_ratio = 3.1
# Each square receives its own random crop and rotation; the seed keeps builds reproducible.
seed = 363

