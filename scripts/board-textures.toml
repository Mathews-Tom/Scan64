# Each side: `source`, `crop` (source pixels per square edge, at least the output square size so
# nothing is upscaled), `tint` (target mean sRGB colour of every square), `contrast` (grain
# amplitude around that mean), and `rotations` (allowed per-square rotations in degrees).
# Wood keeps its grain direction (0/180); stone also turns 90/270. An optional `quality` table
# overrides the encoder quality for high-detail stone so it stays within the budget.

[[boards]]
id = "walnut-maple"
label = "Walnut and maple"
group = "wood"
light = { source = "white_maple_veneer", crop = 320, tint = "#e6d0a8", contrast = 2.0, rotations = [0, 180] }
dark = { source = "walnut_veneer", crop = 320, tint = "#6b4a33", contrast = 1.7, rotations = [0, 180] }

[[boards]]
id = "rosewood-boxwood"
label = "Rosewood and boxwood"
group = "wood"
light = { source = "angli_veneer", crop = 320, tint = "#ead39c", contrast = 1.3, rotations = [0, 180] }
dark = { source = "rosewood_veneer1", crop = 360, tint = "#5c2c1c", contrast = 1.0, rotations = [0, 180] }

[[boards]]
id = "mahogany-maple"
label = "Mahogany and maple"
group = "wood"
light = { source = "white_maple_veneer", crop = 288, tint = "#efdcb8", contrast = 2.0, rotations = [0, 180] }
dark = { source = "sapele_veneer", crop = 288, tint = "#7a3b25", contrast = 2.2, rotations = [0, 180] }

[[boards]]
id = "ebony-boxwood"
label = "Ebony and boxwood"
group = "wood"
light = { source = "angli_veneer", crop = 288, tint = "#e8cf93", contrast = 1.3, rotations = [0, 180] }
dark = { source = "flamed_black_veneer", crop = 320, tint = "#2f2621", contrast = 1.4, rotations = [0, 180] }

[[boards]]
id = "marble"
label = "White and black marble"
group = "stone"
quality = { webp = 72 }
light = { source = "Marble005", crop = 768, tint = "#e7e6e2", contrast = 1.4, rotations = [0, 90, 180, 270] }
dark = { source = "Marble006", crop = 768, tint = "#2b2927", contrast = 1.0, rotations = [0, 90, 180, 270] }

[[boards]]
id = "granite"
