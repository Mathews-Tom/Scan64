<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Scan64</title>
  <desc id="desc">Scan64 banner: a chess board where a three-step hint draws the back-rank move Re8 checkmate, next to the Scan64 wordmark and the tagline "Play, review and practise from your own games".</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142234"/>
      <stop offset="1" stop-color="#1f3a5c"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ec9ff" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#9ec9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d7e9ff" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="board-clip"><rect x="80" y="50" width="320" height="320" rx="6"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9ec9ff" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <style>
    .word { font: 800 104px "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: -3px; }
    .tag { font: 500 30px "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #c3d1df; }
    .chip { font: 600 19px "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #f0f5fa; }
    .meta { font: 500 17px "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #8296aa; letter-spacing: 1.5px; }
    .step { font: 600 17px "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #f0f5fa; }
    .pc { font: 34px "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", "Noto Sans Symbols2", serif; text-anchor: middle; dominant-baseline: central; }
    .w { fill: #ffffff; stroke: #142234; stroke-width: 1.3px; paint-order: stroke; }
    .b { fill: #142234; stroke: #f3e2bd; stroke-width: 0.6px; paint-order: stroke; }
    .scanline { animation: scan 5.5s linear infinite; }
    .arrow { stroke-dasharray: 240; animation: draw 8s ease-in-out infinite; }
    .nudge { animation: nudge 8s steps(1) infinite; }
    .idea { animation: idea 8s steps(1) infinite; }
    @keyframes nudge { 0% { opacity: 1; } 22% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes idea { 0% { opacity: 0; } 22% { opacity: 1; } 45% { opacity: 0; } 100% { opacity: 0; } }
    .arrowhead { animation: target 8s ease-in-out infinite; }
    .target { animation: target 8s ease-in-out infinite; }
    .s1 { animation: s1 8s steps(1) infinite; }
    .s2 { animation: s2 8s steps(1) infinite; }
    .s3 { animation: s3 8s steps(1) infinite; }
    .chip-g { animation: rise 0.9s ease-out both; }
    .c2 { animation-delay: 0.25s; }
    .c3 { animation-delay: 0.5s; }
    @keyframes scan { from { transform: translateY(-60px); } to { transform: translateY(380px); } }
    @keyframes draw { 0%, 45% { stroke-dashoffset: 240; opacity: 1; } 62%, 92% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes target { 0%, 60% { opacity: 0; } 66%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes s1 { 0% { opacity: 1; } 22% { opacity: 0.35; } 100% { opacity: 0.35; } }
    @keyframes s2 { 0% { opacity: 0.35; } 22% { opacity: 1; } 45% { opacity: 0.35; } 100% { opacity: 0.35; } }
    @keyframes s3 { 0% { opacity: 0.35; } 45% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .scanline, .arrow, .arrowhead, .target, .s1, .s2, .s3, .chip-g { animation: none; }
      .scanline { display: none; }
    }
  </style>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#dots)"/>

  <!-- Board: a1 is bottom-left; each square is 40 px. -->
  <rect x="72" y="42" width="336" height="336" rx="10" fill="#0d1826" opacity="0.55"/>
  <g clip-path="url(#board-clip)">
    <rect x="80" y="50" width="320" height="320" fill="#f3e2bd"/>
    <g fill="#c99a4e">
      <rect x="120" y="50" width="40" height="40"/><rect x="200" y="50" width="40" height="40"/><rect x="280" y="50" width="40" height="40"/><rect x="360" y="50" width="40" height="40"/>
      <rect x="80" y="90" width="40" height="40"/><rect x="160" y="90" width="40" height="40"/><rect x="240" y="90" width="40" height="40"/><rect x="320" y="90" width="40" height="40"/>
      <rect x="120" y="130" width="40" height="40"/><rect x="200" y="130" width="40" height="40"/><rect x="280" y="130" width="40" height="40"/><rect x="360" y="130" width="40" height="40"/>
      <rect x="80" y="170" width="40" height="40"/><rect x="160" y="170" width="40" height="40"/><rect x="240" y="170" width="40" height="40"/><rect x="320" y="170" width="40" height="40"/>
      <rect x="120" y="210" width="40" height="40"/><rect x="200" y="210" width="40" height="40"/><rect x="280" y="210" width="40" height="40"/><rect x="360" y="210" width="40" height="40"/>
      <rect x="80" y="250" width="40" height="40"/><rect x="160" y="250" width="40" height="40"/><rect x="240" y="250" width="40" height="40"/><rect x="320" y="250" width="40" height="40"/>
      <rect x="120" y="290" width="40" height="40"/><rect x="200" y="290" width="40" height="40"/><rect x="280" y="290" width="40" height="40"/><rect x="360" y="290" width="40" height="40"/>
      <rect x="80" y="330" width="40" height="40"/><rect x="160" y="330" width="40" height="40"/><rect x="240" y="330" width="40" height="40"/><rect x="320" y="330" width="40" height="40"/>
    </g>
    <!-- Step 1 nudge: the e1 rook; step 2 idea: the boxed-in back rank -->
    <rect class="nudge" x="240" y="330" width="40" height="40" fill="#3d86e0" fill-opacity="0.7" opacity="0"/>
    <rect class="idea" x="80" y="50" width="320" height="40" fill="#e05d4f" fill-opacity="0.35" opacity="0"/>
    <!-- Hint target e8 -->
    <rect class="target" x="240" y="50" width="40" height="40" fill="#2fa36b" fill-opacity="0.55"/>
    <!-- Scanning sweep over the 64 squares -->
    <rect class="scanline" x="80" y="0" width="320" height="56" fill="url(#scan)"/>
  </g>

  <!-- Step 3 hint arrow: Re1 to e8 -->
  <g opacity="0.92">
    <path class="arrow" d="M260 332 L260 98" stroke="#2fa36b" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path class="arrowhead" d="M242 100 L260 64 L278 100 z" fill="#2fa36b"/>
  </g>

  <!-- Black: Kg8, Nc6, pawns a7 f7 g7 h7. White: Kg1, Re1, pawns a2 f2 g2 h2. White to move: Re8#. -->
  <g class="pc">
    <text class="b" x="340" y="70">&#x265A;</text>
    <text class="b" x="180" y="150">&#x265E;</text>
    <text class="b" x="100" y="110">&#x265F;&#xFE0E;</text>
    <text class="b" x="300" y="110">&#x265F;&#xFE0E;</text>
    <text class="b" x="340" y="110">&#x265F;&#xFE0E;</text>
    <text class="b" x="380" y="110">&#x265F;&#xFE0E;</text>
    <text class="w" x="340" y="350">&#x265A;</text>
    <text class="w" x="260" y="350">&#x265C;</text>
    <text class="w" x="100" y="310">&#x265F;&#xFE0E;</text>
    <text class="w" x="300" y="310">&#x265F;&#xFE0E;</text>
    <text class="w" x="340" y="310">&#x265F;&#xFE0E;</text>
    <text class="w" x="380" y="310">&#x265F;&#xFE0E;</text>
  </g>

  <!-- Hint ladder caption -->
  <g transform="translate(80 400)">
    <text class="step s1" x="0" y="0">1 · Nudge</text>
    <text class="step s2" x="108" y="0">2 · Idea</text>
    <text class="step s3" x="200" y="0">3 · Move: Re8#</text>
  </g>

  <!-- Wordmark -->
  <text class="word" x="470" y="170"><tspan fill="#f0f5fa">Scan</tspan><tspan fill="#e7b75f">64</tspan></text>
  <text class="tag" x="474" y="222">Play, review and practise from your own games.</text>

  <g transform="translate(474 256)"><g class="chip-g c1">
    <rect width="230" height="44" rx="22" fill="#293f5b" stroke="#709bc8"/>
    <text class="chip" x="115" y="28" text-anchor="middle">Bots at your level</text>
  </g></g>
  <g transform="translate(718 256)"><g class="chip-g c2">
    <rect width="216" height="44" rx="22" fill="#293f5b" stroke="#709bc8"/>
    <text class="chip" x="108" y="28" text-anchor="middle">3-step hints</text>
  </g></g>
  <g transform="translate(948 256)"><g class="chip-g c3">
    <rect width="270" height="44" rx="22" fill="#293f5b" stroke="#709bc8"/>
    <text class="chip" x="135" y="28" text-anchor="middle">Reviews &amp; puzzles</text>
  </g></g>

  <text class="meta" x="474" y="360">OPEN SOURCE · LOCAL-FIRST · STOCKFISH 18 · GPL-3.0</text>
</svg>
