[package]
name = "scan64-desktop"
version = "0.8.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
serde_json = "1"
base64 = "0.23"
minisign-verify = "0.3"
url = "2"
tauri-utils = "=2.10.2"

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-process = "=2.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.23"
minisign-verify = "0.3"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
updater-test = []
