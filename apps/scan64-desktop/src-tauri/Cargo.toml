[package]
name = "scan64-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
