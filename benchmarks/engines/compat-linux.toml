# Engine compatibility set, Linux run (#411, the linux-5090 share of #397).
# Run: uv run python -m benchmarks.engines.compat benchmarks/engines/compat-linux.toml
# Same [run] inputs as compat.toml. Profiles live in config/engines/compat/linux/
# and point at the engines installed under ~/.local/opt/engines/<name>/ on
# linux-5090. Rodent V, Triumviratus and Maia-3 start through small wrapper
# scripts there, because a profile cannot set a working directory, an
# environment variable or command-line arguments.

[run]
results_dir = "benchmarks/engines/results"
# Fried Liver Attack to 6.Nxf7: a real game with a sacrifice for the fast pass.
game = ["e2e4", "e7e5", "g1f3", "b8c6", "f1c4", "g8f6", "f3g5", "d7d5", "e4d5", "f6d5", "g5f7"]
focused_plies = [6, 11]                       # positions after these plies get the focused pass
position = "r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1"   # kiwipete
lesson_position = "r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4"  # mate in one
bot_level = 4
skill_level = 5

[[engines]]
name = "Stockfish 18"
profile = "config/engines/compat/linux/stockfish-18.toml"
licence = "GPL-3.0"
source = "https://github.com/official-stockfish/Stockfish"
stresses = "reference engine"

[[engines]]
name = "Alexandria"
profile = "config/engines/compat/linux/alexandria.toml"
licence = "GPL-3.0"
source = "https://github.com/PGG106/Alexandria"
stresses = "no MultiPV; unusual centipawn scale"

[[engines]]
name = "Minic"
profile = "config/engines/compat/linux/minic.toml"
licence = "GPL-3.0"
source = "https://github.com/tryingsomestuff/Minic"
stresses = "MultiPV capped below 8; non-standard WDL option"

