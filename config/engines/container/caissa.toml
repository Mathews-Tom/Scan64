# Caissa 2.0 (MIT, network MIT) as bundled in the Docker image (#396, #438): the
# analysis engine. The network is embedded in the binary, so it has no network
# file and no working-directory dependency.
# A fresh image install selects it for analysis through
# SCAN64_BUNDLED_ENGINES_DIR (scan64.providers.engine.install_defaults).
# SCAN64_ENGINE_CONFIG=<this path> selects it explicitly.
[engine]
name = "caissa"
binary_path = "/usr/local/bin/caissa"
threads = 1
hash_mb = 16

[engine.options]
UCI_ShowWDL = true
