# Caissa 2.0 (MIT, network MIT) as bundled in the Docker image (#396, #438): the
# analysis engine. The network is embedded in the binary, so it has no network
# file and no working-directory dependency.
# Select with: SCAN64_ENGINE_CONFIG=/usr/local/share/scan64/engines/caissa.toml
[engine]
name = "caissa"
binary_path = "/usr/local/bin/caissa"
threads = 1
hash_mb = 16

[engine.options]
UCI_ShowWDL = true
