# Linux compat set (#411): a large option list and personality files.
# The wrapper changes to the install directory (a profile cannot set a working
# directory); personalities/ and books/ are resolved relative to it.
[engine]
name = "rodent-v"
binary_path = "~/.local/opt/engines/rodent-v/rodent_v-cwd"
# Node- and depth-only searches that never return stop here (#397, d08c64f), so
# Rodent V records unavailable in 30 s instead of the 120 s default.
search_deadline_s = 30
