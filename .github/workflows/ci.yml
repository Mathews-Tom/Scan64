name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install pinned Stockfish 18
        run: |
          stockfish_archive="$RUNNER_TEMP/stockfish-18.tar"
          stockfish_dir="$RUNNER_TEMP/stockfish"
          curl --fail --location --retry 3 --output "$stockfish_archive" "https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64.tar"
          echo "5c6f38b02a4da5f3ffe763f27da6c3e743eebefd92b50cb3661623b96696adff  $stockfish_archive" | sha256sum --check
          mkdir "$stockfish_dir"
          tar --extract --file "$stockfish_archive" --directory "$stockfish_dir" --strip-components=1
          mv "$stockfish_dir/stockfish-ubuntu-x86-64" "$stockfish_dir/stockfish"
          echo "$stockfish_dir" >> "$GITHUB_PATH"
      # Second UCI engine for tests/integration/test_second_engine.py (docs/engines.md).
      # The cache key holds the pinned commit, the source checksum and the compiler flags.
      - name: Cache pinned Ethereal build
        id: ethereal-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ethereal-bin
          key: ethereal-${{ runner.os }}-${{ runner.arch }}-0e47e9b67f345c75eb965d9fb3e2493b6a11d09a-46ac7496-popcnt-v1
      - name: Build pinned Ethereal 14.40
        if: steps.ethereal-cache.outputs.cache-hit != 'true'
        run: |
          ethereal_commit=0e47e9b67f345c75eb965d9fb3e2493b6a11d09a
          ethereal_archive="$RUNNER_TEMP/ethereal-src.tar.gz"
          ethereal_src="$RUNNER_TEMP/ethereal-src"
          curl --fail --location --retry 3 --output "$ethereal_archive" "https://github.com/AndyGrant/Ethereal/archive/$ethereal_commit.tar.gz"
          echo "46ac749697f33271c24afb0d501092ab4f3b6986b37573f6c42cd728d34766bf  $ethereal_archive" | sha256sum --check
          mkdir "$ethereal_src" "$RUNNER_TEMP/ethereal-bin"
          tar --extract --gzip --file "$ethereal_archive" --directory "$ethereal_src" --strip-components=1
          cd "$ethereal_src/src"
          gcc -std=gnu11 -O3 -DNDEBUG -DUSE_NNUE=0 -DUSE_POPCNT -mpopcnt *.c pyrrhic/tbprobe.c -lpthread -lm -o "$RUNNER_TEMP/ethereal-bin/Ethereal"
      - name: Expose Ethereal to the second-engine test
        run: |
          ethereal="$RUNNER_TEMP/ethereal-bin/Ethereal"
          printf 'uci\nquit\n' | "$ethereal" | grep --quiet '^uciok'
          echo "SCAN64_TEST_SECOND_ENGINE=$ethereal" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Install desktop Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/scan64-desktop/src-tauri
      - name: Sync Python dependencies
        run: uv sync --frozen --all-groups
      - name: Install frontend dependencies
        run: pnpm --dir apps/scan64-web install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --dir apps/scan64-web exec playwright install --with-deps chromium
      - name: Second-engine test (fast fail)
        timeout-minutes: 5
        run: |
          sudo apt-get install --no-install-recommends -y gdb >/dev/null
          mkfifo "$RUNNER_TEMP/eth.in"
          "$SCAN64_TEST_SECOND_ENGINE" < "$RUNNER_TEMP/eth.in" > "$RUNNER_TEMP/eth.out" 2>&1 &
          eth_pid=$!
          exec 3> "$RUNNER_TEMP/eth.in"
          printf 'uci\nisready\nposition startpos\ngo nodes 20000\n' >&3
          sleep 5
          cat "$RUNNER_TEMP/eth.out"; lscpu | head -20; ps -o pid,stat,pcpu,nlwp,cmd -p "$eth_pid"
          sudo gdb -p "$eth_pid" -batch -ex "info threads" -ex "thread apply all bt" 2>&1 | tail -40
          exec 3>&-; kill "$eth_pid" || true
          uv run pytest tests/integration/test_second_engine.py -vv -p no:cacheprovider -o faulthandler_timeout=90
      - name: Run repository quality gate
        run: scripts/check.sh
