name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release/**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BROWSER: /usr/bin/true

jobs:
  build:
    name: Signed build (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: ${{ github.event_name != 'release' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: ${{ github.event_name != 'release' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make
      - name: Expose MinGW tools
        if: runner.os == 'Windows'
        run: echo '${{ steps.msys2.outputs.msys2-location }}/mingw64/bin' >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name != 'release'
        with:
          workspaces: apps/scan64-desktop/src-tauri
      - name: Install locked dependencies and pinned licence generator
        run: |
          uv sync --frozen --all-groups --python-preference only-managed
          pnpm install --frozen-lockfile
          cargo install cargo-about --version 0.8.2 --locked
      - name: Freeze server and build pinned Stockfish with bundled notices
        run: |
          pnpm --dir apps/scan64-web build
          uv run --no-sync python scripts/build-server.py
      - name: Build installers and sign updater bundles
        env:
          # Only this step receives the owner-managed secrets. Never print env.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set +x
          pnpm --dir apps/scan64-desktop tauri build --ci --config src-tauri/tauri.bundle.conf.json --config '{"bundle":{"createUpdaterArtifacts":true}}' --bundles '${{ matrix.bundles }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-bundles-${{ matrix.os }}
          path: |
            apps/scan64-desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/scan64-desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            apps/scan64-desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/scan64-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/scan64-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            apps/scan64-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/scan64-desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/scan64-desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'release' && 14 || 1 }}

  verify:
    name: Verify signatures and updater manifest
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install pinned signature verifier (no build caches or secrets)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y minisign=0.11-1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-bundles-*
          path: release-input
      - name: Verify every signature and write latest.json
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python scripts/release/verify.py release-input verified-release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-release-assets
          path: verified-release-assets/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'release' && 14 || 1 }}

  upload:
    name: Attach verified assets to published release
    needs: verify
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # No checkout and no execution of artifact-supplied code in the writer job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release-assets
          path: assets
      - name: Upload verified installers, bundles, signatures and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          set +x
          gh release upload "$RELEASE_TAG" assets/* --clobber
          printf 'Attached verified assets to %s.\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
